<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de tabelas 005</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;

        }
        table{
            width:500px;
            border-collapse:collapse;
        }
        caption{
            font-size:1.3em;
            font-weight:bolder;
            padding:8px;
        }
        th, td{
            border:1px solid black;
            padding:8px;
        }
        .cnome{
            background-color:aqua;
        }
        .group{
            background-color:blueviolet;
            height:120;
        }



    </style>
</head>
<body>
    <h1>Tabela 005</h1>
    <table>
         
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="group" span="2"><!--Nesse caso, pega duas colunas ao mesmo tempo, usando o "span"-->
        
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Beatriz</td>
            <td>F</td>
            <td>24</td>
            <td>Jornalista</td>
        </tr>

        <tr>
            <td>Ingrid Miler</td>
            <td>F</td>
            <td>26</td>
            <td>Advogada</td>
        </tr>

        <tr>
            <td>Pedro de Alcântara</td>
            <td>M</td>
            <td>14</td>
            <td>Chefe de Estado</td>
        </tr>

        <tr>
            <td>Elon Musk</td>
            <td>M</td>
            <td>45</td>
            <td>Inventor</td>
        </tr>

    </table>
</body>
</html>
